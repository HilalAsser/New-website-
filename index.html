<!DOCTYPE html>
<html>
<head>
    <title>My Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 320px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .password-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .password-box input {
            flex: 1;
            margin-bottom: 0;
        }

        .password-box button {
            width: 50px;
            border: none;
            border-radius: 8px;
            background: #eee;
            font-size: 18px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
        }

        .forgot {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Welcome Back 👋</h2>

        <input type="email" placeholder="Enter Email">

        <div class="password-box">
            <input type="password" id="password" placeholder="Enter Password">
            <button type="button" onclick="showPassword()">👁️</button>
        </div>

        <button class="login-button" onclick="login()">Login</button>

        <div class="forgot">
            Forgot Password?
        </div>

    </div>

    <script>
        function showPassword() {
            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }

        function login() {
            window.location.href = "home.html";
        }
    </script>

</body>
</html>
